function blogClearImage(){
  blogSelectedImageFile = null; blogExistingImagePath = null;
  document.getElementById('blogImageFile').value = '';
  document.getElementById('blogImagePreviewWrap').style.display = 'none';
  blogUpdatePreview();
}
function blogSetVideoMode(mode){
  blogVideoMode = mode;
  document.getElementById('blogVidYt').classList.toggle('active', mode === 'yt');
  document.getElementById('blogVidUp').classList.toggle('active', mode === 'upload');
  document.getElementById('blogVideoYtWrap').style.display = mode === 'yt' ? 'block' : 'none';
  document.getElementById('blogVideoUpWrap').style.display = mode === 'upload' ? 'block' : 'none';
  blogUpdatePreview();
}
function blogHandleVideoSelect(e){const file=e.target.files[0];if(!file)return;if(!file.type.startsWith('video/')){showErrorAlert('blogPublishStatus','Choose a valid video file.');e.target.value='';return}if(file.size>20*1024*1024){showErrorAlert('blogPublishStatus','Video must be 20MB or smaller.');e.target.value='';return}blogSelectedVideoFile=file;document.getElementById('blogVideoFileName').textContent=`${file.name} (${(file.size/1024/1024).toFixed(1)} MB)`;document.getElementById('blogVideoPreviewWrap').style.display='flex';blogUpdatePreview()}

function blogClearVideo(){blogSelectedVideoFile=null;blogExistingVideoPath=null;document.getElementById('blogVideoFile').value='';document.getElementById('blogVideoPreviewWrap').style.display='none';document.getElementById('blogVideoFileName').textContent='';blogUpdatePreview()}

function extractYouTubeId(url){
  if(!url) return null;
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
  return m ? m[1] : null;
}
}

function blogUpdatePreview(){const title=document.getElementById('blogTitle').value.trim(),tag=document.getElementById('blogTag').value.trim(),content=document.getElementById('blogContent').value.trim(),quote=document.getElementById('blogQuote').value.trim(),box=document.getElementById('blogPreviewBox'),hasImage=!!(blogSelectedImageFile||blogExistingImagePath),hasVideo=!!(blogSelectedVideoFile||blogExistingVideoPath||document.getElementById('blogVideoUrl').value.trim());if(!title&&!content&&!hasImage&&!hasVideo){box.innerHTML='<span style="color:var(--dim)">Start typing to preview...</span>';return}const paragraphs=content.split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean);let html=`<div style="font-size:11px;color:var(--dim);margin-bottom:6px;">${escapeHtml(tag||'Reflection')} · ${formatDateTime(new Date())}</div>`;html+=`<div style="font-weight:800;font-size:15px;margin-bottom:8px;">${escapeHtml(title||'Title')}</div>`;const imageSrc=document.getElementById('blogImagePreviewImg').src;if(hasImage&&imageSrc)html+=`<img src="${escapeHtml(imageSrc)}" alt="" style="max-width:140px;border-radius:8px;margin-bottom:8px;display:block;">`;paragraphs.forEach(p=>{html+=`<div style="font-size:13px;color:var(--sub);margin-bottom:6px;white-space:pre-wrap;">${escapeHtml(p)}</div>`});if(quote)html+=`<div style="border-left:2px solid var(--text);padding-left:10px;font-style:italic;margin-top:8px;">${escapeHtml(quote)}</div>`;if(hasVideo)html+=`<div style="margin-top:10px;font-size:11px;color:var(--dim);"><i class="fa-solid fa-video"></i> Video attached</div>`;box.innerHTML=html}

  blogEditingId = id;
  blogEditingOriginalDateTime = dateTimeStr;
  document.getElementById('blogFormTitle').textContent = 'Edit Post';
  document.getElementById('blogEditingFlag').classList.add('show');
  document.getElementById('blogEditingTitle').textContent = title;
  document.getElementById('blogPublishBtnText').textContent = 'Save Changes';
  document.getElementById('blogTitle').value = title;
  document.getElementById('blogTag').value = tag;
  document.getElementById('blogContent').value = contentText;
  document.getElementById('blogQuote').value = quoteText;
  blogSetLang(lang);
  blogUpdatePreview();
  switchBlogTab('write');
}
function blogCancelEdit(){
  blogEditingId = null; blogEditingOriginalDateTime = null;
  document.getElementById('blogFormTitle').textContent = 'New Post';
  document.getElementById('blogEditingFlag').classList.remove('show');
  document.getElementById('blogPublishBtnText').textContent = 'Publish';
  document.getElementById('blogTitle').value = '';
  document.getElementById('blogTag').value = '';
  document.getElementById('blogContent').value = '';
  document.getElementById('blogQuote').value = '';
  blogClearImage(); blogClearVideo();
  document.getElementById('blogVideoUrl').value = '';
  blogSetVideoMode('yt');
async function blogUploadPendingMedia(){let imagePath=blogExistingImagePath,videoPath=blogExistingVideoPath;if(blogSelectedImageFile){const b64=await readFileAsBase64(blogSelectedImageFile),fname=`uploads/${Date.now()}-photo.jpg`;await putBinaryFile(fname,b64,null,`Upload image: ${fname}`);imagePath=fname}if(blogVideoMode==='upload'&&blogSelectedVideoFile){if(blogSelectedVideoFile.size>20*1024*1024)throw new Error('Video must be 20MB or smaller.');const b64=await readFileAsBase64(blogSelectedVideoFile),fname=`uploads/${Date.now()}-${sanitizeFilename(blogSelectedVideoFile.name)}`;await putBinaryFile(fname,b64,null,`Upload video: ${blogSelectedVideoFile.name}`);videoPath=fname}else if(blogVideoMode==='yt')videoPath=null;return{imagePath,videoPath}}


async function blogSubmitPost(){
  if(blogEditingId) await blogUpdatePost(); else await blogPublishPost();
}

async function blogPublishPost(){
  const title = document.getElementById('blogTitle').value.trim();
  const tag = document.getElementById('blogTag').value.trim();
  const content = document.getElementById('blogContent').value.trim();
  const quote = document.getElementById('blogQuote').value.trim();
  if(!localStorage.getItem('gh_token')){ showAlert('blogPublishStatus','<i class="fa-solid fa-triangle-exclamation"></i> Connect in My Profile first','alert-bad'); return; }
  if(!title || !content){ showAlert('blogPublishStatus','<i class="fa-solid fa-triangle-exclamation"></i> Title and content required','alert-bad'); return; }
  const btn = document.getElementById('blogPublishBtn');
  btn.disabled = true;
  showAlert('blogPublishStatus','<i class="fa-solid fa-spinner fa-spin"></i> Publishing...','alert-load');
  try {
    const file = await getFile('blog.html');
    if(!file) throw new Error('blog.html not found');
    if(!file.content.includes(BLOG_INSERT_MARK)) throw new Error('Admin marker not found in blog.html');
    const { imagePath, videoPath } = await blogUploadPendingMedia();
    const videoUrlVal = blogVideoMode === 'yt' ? normalizeYoutubeUrl(document.getElementById('blogVideoUrl').value) : '';
    const newId = 'post-' + Date.now();
    const block = blogBuildArticleBlock(newId, title, tag, content, quote, blogCurrentLang, null, imagePath, videoPath, videoUrlVal);
    const updatedContent = file.content.replace(BLOG_INSERT_MARK, BLOG_INSERT_MARK + '\n\n' + block);
    await putFile('blog.html', updatedContent, file.sha, `Add blog post: ${title}`);
    showAlert('blogPublishStatus','<i class="fa-solid fa-circle-check"></i> Published!','alert-ok');
    blogCancelEdit();
    blogLoadPostsList();
  } catch(e){ showAlert('blogPublishStatus','<i class="fa-solid fa-circle-xmark"></i> ' + e.message,'alert-bad'); }
  finally { btn.disabled = false; }
}

async function blogUpdatePost(){
  const title = document.getElementById('blogTitle').value.trim();
  const tag = document.getElementById('blogTag').value.trim();
  const content = document.getElementById('blogContent').value.trim();
  const quote = document.getElementById('blogQuote').value.trim();
  if(!title || !content){ showAlert('blogPublishStatus','<i class="fa-solid fa-triangle-exclamation"></i> Title and content required','alert-bad'); return; }
  const btn = document.getElementById('blogPublishBtn');
  btn.disabled = true;
  showAlert('blogPublishStatus','<i class="fa-solid fa-spinner fa-spin"></i> Saving...','alert-load');
  try {
    const file = await getFile('blog.html');
    if(!file) throw new Error('blog.html not found');
    const startTag = `<!-- POST:${blogEditingId}:START -->`, endTag = `<!-- POST:${blogEditingId}:END -->`;
    const s = file.content.indexOf(startTag), e = file.content.indexOf(endTag);
    if(s === -1 || e === -1) throw new Error('Post not found');
    const { imagePath, videoPath } = await blogUploadPendingMedia();
    const videoUrlVal = blogVideoMode === 'yt' ? normalizeYoutubeUrl(document.getElementById('blogVideoUrl').value) : '';
    const newBlock = blogBuildArticleBlock(blogEditingId, title, tag, content, quote, blogCurrentLang, blogEditingOriginalDateTime, imagePath, videoPath, videoUrlVal).trim();
    const updatedContent = file.content.slice(0, s) + newBlock + file.content.slice(e + endTag.length);
    await putFile('blog.html', updatedContent, file.sha, `Update blog post: ${title}`);
    showAlert('blogPublishStatus','<i class="fa-solid fa-circle-check"></i> Saved!','alert-ok');
    blogCancelEdit();
    blogLoadPostsList();
  } catch(e){ showAlert('blogPublishStatus','<i class="fa-solid fa-circle-xmark"></i> ' + e.message,'alert-bad'); }
  finally { btn.disabled = false; }
}

let blogPendingDeleteId = null, blogPendingDeleteTitle = null, blogPendingDeleteIsPost = false;

async function blogStartEditPost(id){
  try {
    const file = await getFile('blog.html');
    if(!file) throw new Error('blog.html not found');
    const startTag = `<!-- POST:${id}:START -->`, endTag = `<!-- POST:${id}:END -->`;
    const s = file.content.indexOf(startTag), e = file.content.indexOf(endTag);
    if(s === -1 || e === -1) throw new Error('Post not found');
    const blockHtml = file.content.slice(s + startTag.length, e);
    const parser = new DOMParser();
    const doc = parser.parseFromString(`<div>${blockHtml}</div>`, 'text/html');
    const article = doc.querySelector('article');
    if(!article) throw new Error('Could not read this post');
    const h1 = article.querySelector('.article-h1, .article-h1-bn');
    const tagEl = article.querySelector('.article-tag');
    const dateEl = article.querySelector('.article-date');
    const quoteEl = article.querySelector('.article-quote p');
    const imgEl = article.querySelector('.article-image img');
    const videoEl = article.querySelector('.article-video video');
    const iframeEl = article.querySelector('.article-video iframe');
    const paragraphs = Array.from(article.querySelectorAll('.article-p')).map(p => p.textContent.trim());
    const lang = h1 && h1.classList.contains('article-h1-bn') ? 'bn' : 'en';

    blogClearImage(); blogClearVideo();
    document.getElementById('blogVideoUrl').value = '';
    blogSetVideoMode('yt');
    if(imgEl){
      blogExistingImagePath = imgEl.getAttribute('src');
      document.getElementById('blogImagePreviewImg').src = blogExistingImagePath;
      document.getElementById('blogImagePreviewWrap').style.display = 'flex';
    }
    if(videoEl){
      blogSetVideoMode('upload');
      blogExistingVideoPath = videoEl.getAttribute('src');
      document.getElementById('blogVideoFileName').textContent = '(existing video — choose a new file to replace)';
      document.getElementById('blogVideoPreviewWrap').style.display = 'flex';
    } else if(iframeEl){
      const src = iframeEl.getAttribute('src') || '';
      const idMatch = src.match(/embed\/([\w-]{11})/);
      if(idMatch) document.getElementById('blogVideoUrl').value = `https://youtube.com/watch?v=${idMatch[1]}`;
      blogSetVideoMode('yt');
    }

    blogEnterEditMode(id, h1 ? h1.textContent.trim() : '', tagEl ? tagEl.textContent.trim() : '', paragraphs.join('\n\n'), quoteEl ? quoteEl.textContent.trim() : '', lang, dateEl ? dateEl.textContent.trim() : null);
  } catch(e){ showErrorAlert('blogPublishStatus','Could not load post — '+e.message); }
}

function blogDeletePost(id, title){
  blogPendingDeleteId = id; blogPendingDeleteTitle = title; blogPendingDeleteIsPost = true;
  document.getElementById('deleteModalTitle').textContent = title;
  document.getElementById('deleteModal').classList.add('show');
}

async function blogLoadPostsList(){
  const listEl = document.getElementById('blogPostsList');
  if(!localStorage.getItem('gh_token')){ listEl.innerHTML = '<div class="item-empty">Connect first.</div>'; return; }
  listEl.innerHTML = '<div class="item-empty"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</div>';
  try {
    const file = await getFile('blog.html');
    if(!file) throw new Error('blog.html not found');
    const regex = /<!-- POST:([\w-]+):START -->([\s\S]*?)<!-- POST:\1:END -->/g;
    let match, html = '', count = 0;
    while((match = regex.exec(file.content)) !== null){
      const id = match[1];
      const parser = new DOMParser();
      const doc = parser.parseFromString(`<div>${match[2]}</div>`, 'text/html');
      const article = doc.querySelector('article');
      if(!article) continue;
      const h1 = article.querySelector('.article-h1, .article-h1-bn');
      const tagEl = article.querySelector('.article-tag');
      const dateEl = article.querySelector('.article-date');
      const titleText = h1 ? h1.textContent.trim() : '(untitled)';
      html += `<div class="item-row">
        <div class="item-row-head">
          <div class="item-row-title">${escapeHtml(titleText)}</div>
          <div class="item-row-actions">
            <button class="btn-icon" data-baction="edit" data-bid="${escapeHtml(id)}" title="Edit"><i class="fa-solid fa-pen"></i></button>
            <button class="btn-icon danger" data-baction="delete" data-bid="${escapeHtml(id)}" data-btitle="${escapeHtml(titleText)}" title="Delete"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>
        <div style="font-size:11.5px;color:var(--dim);">${tagEl ? escapeHtml(tagEl.textContent.trim()) : ''} · ${dateEl ? escapeHtml(dateEl.textContent.trim()) : ''}</div>
      </div>`;
      count++;
    }
    listEl.innerHTML = count ? html : '<div class="item-empty">No posts yet.</div>';
  } catch(e){ listEl.innerHTML = `<div class="item-empty" style="color:var(--bad);">${escapeHtml(e.message)}</div>`; }
}
document.getElementById('blogPostsList').addEventListener('click', function(e){
  const btn = e.target.closest('button[data-baction]');
  if(!btn) return;
  if(btn.dataset.baction === 'edit') blogStartEditPost(btn.dataset.bid);
  else if(btn.dataset.baction === 'delete') blogDeletePost(btn.dataset.bid, btn.dataset.btitle);
});

function closeDeleteModal(){
  document.getElementById('deleteModal').classList.remove('show');
  blogPendingDeleteId = null; blogPendingDeleteTitle = null; blogPendingDeleteIsPost = false;
}
document.getElementById('confirmDeleteBtn').addEventListener('click', async function(){
  if(!blogPendingDeleteIsPost) { closeDeleteModal(); return; }
  const id = blogPendingDeleteId, title = blogPendingDeleteTitle;
  const btn = this;
  btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
  try {
    const file = await getFile('blog.html');
    if(!file) throw new Error('blog.html not found');
    const startTag = `<!-- POST:${id}:START -->`, endTag = `<!-- POST:${id}:END -->`;
    const s = file.content.indexOf(startTag), e = file.content.indexOf(endTag);
    if(s === -1 || e === -1) throw new Error('Post not found');
    const updatedContent = file.content.slice(0, s) + file.content.slice(e + endTag.length);
    await putFile('blog.html', updatedContent, file.sha, `Delete blog post: ${title}`);
    if(blogEditingId === id) blogCancelEdit();
    closeDeleteModal();
    blogLoadPostsList();
  } catch(e){ showErrorAlert('blogPublishStatus','Could not delete — '+e.message); }
  finally { btn.disabled = false; btn.innerHTML = 'Delete'; }
});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.getElementById('siteModal').classList.contains('show'))closeSiteModal();else if(document.getElementById('deleteModal').classList.contains('show'))closeDeleteModal();else if(document.getElementById('drawer').classList.contains('open'))closeDrawer()}});
['deleteModal','siteModal'].forEach(id=>{const el=document.getElementById(id);el.addEventListener('click',e=>{if(e.target===el){id==='deleteModal'?closeDeleteModal():closeSiteModal()}})});
