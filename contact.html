<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Riyad Bin Alom</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <style>
    :root{
      --bg:#041027;
      --card: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.07);
      --text:#eef6ff;
      --muted: rgba(220,230,250,0.75);

      --accent1:#26a3ff;
      --accent2:#7c3aed;
      --accent-grad: linear-gradient(90deg,var(--accent1),var(--accent2));

      --radius:18px;
      --maxw:1100px;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      background: var(--bg);
      color: var(--text);
      line-height:1.6;
    }

    a{color:inherit;text-decoration:none}

    .wrap{
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 18px 16px 50px;
    }

    /* TOP BAR */
    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:14px;
      padding: 10px 0 18px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .logo{
      width:44px;
      height:44px;
      border-radius:14px;
      display:grid;
      place-items:center;
      background: var(--accent-grad);
      color:#031029;
      font-weight:900;
      letter-spacing:-0.5px;
    }

    .brand-name{
      font-weight:900;
      font-size:16px;
      letter-spacing:-0.4px;
    }

    /* HAMBURGER MENU */
    .menu-btn{
      width:48px;
      height:48px;
      border-radius:14px;
      border:1px solid var(--border);
      background: rgba(255,255,255,0.03);
      color:#fff;
      cursor:pointer;
      display:grid;
      place-items:center;
      transition:.2s;
    }

    .menu-btn:hover{
      transform: translateY(-2px);
      box-shadow:0 14px 40px rgba(0,0,0,0.35);
    }

    .menu{
      position: relative;
    }

    .menu-panel{
      position:absolute;
      right:0;
      top:58px;
      width: 220px;
      background: rgba(10,20,45,0.92);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:18px;
      padding:10px;
      box-shadow: 0 25px 70px rgba(0,0,0,0.45);
      display:none;
      backdrop-filter: blur(10px);
      z-index:99;
    }

    .menu-panel a{
      display:flex;
      align-items:center;
      gap:10px;
      padding:12px 12px;
      border-radius:14px;
      color: var(--muted);
      font-weight:800;
      transition:.15s;
    }

    .menu-panel a i{
      width:18px;
      text-align:center;
      color: rgba(220,230,250,0.6);
    }

    .menu-panel a:hover{
      background: rgba(255,255,255,0.04);
      color:#fff;
    }

    /* MAIN GRID */
    .contact-grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 10px;
    }

    .card{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: 0 18px 55px rgba(0,0,0,0.35);
    }

    /* LEFT */
    .title{
      font-size: 40px;
      font-weight: 900;
      letter-spacing:-1px;
      line-height:1.05;
      margin-bottom: 10px;
    }

    .subtitle{
      font-size: 16px;
      color: var(--muted);
      margin-bottom: 18px;
      max-width: 520px;
    }

    .small-text{
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 18px;
    }

    .info-row{
      display:flex;
      align-items:center;
      gap:12px;
      margin-top: 16px;
      flex-wrap:wrap;
    }

    .icon-box{
      width:46px;
      height:46px;
      border-radius:14px;
      background: rgba(255,255,255,0.03);
      border:1px solid rgba(255,255,255,0.06);
      display:grid;
      place-items:center;
      color:#fff;
      flex:0 0 auto;
    }

    .email-line{
      color:#fff;
      font-weight:800;
      text-decoration: underline;
      text-underline-offset:4px;
      word-break: break-all;
    }

    .social-row{
      display:flex;
      gap:10px;
      margin-top: 18px;
      flex-wrap:wrap;
    }

    .social-row a{
      width:46px;
      height:46px;
      border-radius:14px;
      display:grid;
      place-items:center;
      background: rgba(255,255,255,0.03);
      border:1px solid rgba(255,255,255,0.06);
      transition:.15s;
    }

    .social-row a:hover{
      transform: translateY(-3px);
      box-shadow:0 16px 50px rgba(38,163,255,0.12);
    }

    /* RIGHT FORM */
    .form-grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    label{
      display:block;
      font-weight:800;
      font-size: 13px;
      color: rgba(220,230,250,0.75);
      margin-bottom: 7px;
    }

    input, textarea{
      width:100%;
      border-radius:14px;
      border:1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
      padding: 12px 12px;
      color:#fff;
      outline:none;
      font-family: inherit;
      font-size: 14px;
      transition:.15s;
    }

    input:focus, textarea:focus{
      border-color: rgba(38,163,255,0.35);
      box-shadow: 0 0 0 4px rgba(38,163,255,0.10);
    }

    textarea{
      min-height: 140px;
      resize: vertical;
    }

    .full{
      grid-column: 1 / -1;
    }

    .send-row{
      display:flex;
      justify-content:flex-end;
      margin-top: 14px;
    }

    .send-btn{
      border:none;
      border-radius:14px;
      padding: 12px 18px;
      background: var(--accent-grad);
      color:#031029;
      font-weight:900;
      cursor:pointer;
      transition:.15s;
      min-width: 140px;
    }

    .send-btn:hover{
      transform: translateY(-2px);
      box-shadow:0 18px 55px rgba(38,163,255,0.18);
    }

    footer{
      margin-top: 28px;
      text-align:center;
      color: var(--muted);
      font-size: 14px;
    }

    /* RESPONSIVE */
    @media (max-width: 980px){
      .contact-grid{grid-template-columns: 1fr;}
      .title{font-size: 34px;}
    }

    @media (max-width: 520px){
      .form-grid{grid-template-columns: 1fr;}
      .title{font-size: 32px;}
      .card{padding:18px;}
    }
  </style>
</head>

<body>
  <div class="wrap">

    <!-- TOP BAR -->
    <div class="topbar">
      <div class="brand">
        <div class="logo">R</div>
        <div class="brand-name">Riyad Bin Alom</div>
      </div>

      <!-- 3 DOT / HAMBURGER MENU -->
      <div class="menu">
        <button class="menu-btn" id="menuBtn" aria-label="Menu">
          <i class="fa-solid fa-bars"></i>
        </button>

        <div class="menu-panel" id="menuPanel">
          <a href="index.html"><i class="fa-solid fa-house"></i> Home</a>
          <a href="about.html"><i class="fa-solid fa-user"></i> About</a>
          <a href="skills.html"><i class="fa-solid fa-code"></i> Skills</a>
          <a href="blog.html"><i class="fa-solid fa-pen-nib"></i> Blog</a>
          <a href="contact.html"><i class="fa-solid fa-envelope"></i> Contact</a>
        </div>
      </div>
    </div>

    <!-- MAIN -->
    <div class="contact-grid">

      <!-- LEFT CARD -->
      <section class="card">
        <div class="title">Get in Touch</div>
        <div class="subtitle">I’d love to hear from you!</div>

        <div class="small-text">
          If you have any inquiries, collaborations, or just want to say hi — feel free to send a message.
        </div>

        <div class="info-row">
          <div class="icon-box"><i class="fa-regular fa-envelope"></i></div>
          <a class="email-line" href="mailto:riyadbinalom78@gmail.com">riyadbinalom78@gmail.com</a>
        </div>

        <div class="social-row">
          <a href="https://www.facebook.com/riyadbinalom33" target="_blank" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
          <a href="https://x.com/Riyad_Bin_Alom" target="_blank" aria-label="X"><i class="fa-brands fa-x-twitter"></i></a>
          <a href="https://www.instagram.com/riyadbinalom33" target="_blank" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
          <a href="https://www.youtube.com/@3RiyadBinalom" target="_blank" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
        </div>
      </section>

      <!-- RIGHT CARD (FORM) -->
      <section class="card">
        <form id="contactForm">
          <div class="form-grid">

            <div>
              <label for="firstName">First Name</label>
              <input id="firstName" type="text" placeholder="Your first name" required>
            </div>

            <div>
              <label for="lastName">Last Name</label>
              <input id="lastName" type="text" placeholder="Your last name" required>
            </div>

            <div class="full">
              <label for="email">Email *</label>
              <input id="email" type="email" placeholder="your@email.com" required>
            </div>

            <div class="full">
              <label for="message">Message</label>
              <textarea id="message" placeholder="Write your message..." required></textarea>
            </div>

          </div>

          <div class="send-row">
            <button class="send-btn" type="submit">Send</button>
          </div>
        </form>
      </section>

    </div>

    <footer>© 2026 • Riyad Bin Alom</footer>
  </div>

  <script>
    // MENU TOGGLE
    const menuBtn = document.getElementById("menuBtn");
    const menuPanel = document.getElementById("menuPanel");

    menuBtn.addEventListener("click", () => {
      menuPanel.style.display = (menuPanel.style.display === "block") ? "none" : "block";
    });

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".menu")) {
        menuPanel.style.display = "none";
      }
    });

    // FORM SUBMIT (MAILTO)
    document.getElementById("contactForm").addEventListener("submit", function(e){
      e.preventDefault();

      const first = document.getElementById("firstName").value.trim();
      const last = document.getElementById("lastName").value.trim();
      const email = document.getElementById("email").value.trim();
      const msg = document.getElementById("message").value.trim();

      const subject = encodeURIComponent("Message from Portfolio Contact Form");
      const body = encodeURIComponent(
        "Name: " + first + " " + last + "\n" +
        "Email: " + email + "\n\n" +
        "Message:\n" + msg
      );

      window.location.href = `mailto:riyadbinalom78@gmail.com?subject=${subject}&body=${body}`;
    });
  </script>
</body>
</html>
